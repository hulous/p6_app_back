services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:13
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshops_user -d workshopsdb -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
volumes:
  postgres-data:
    driver: local
